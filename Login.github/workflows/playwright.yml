name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*' # Use the LTS version or your specific version
        
    - name: Install dependencies
      run: npm ci # Or 'npm install' if you don't have a package-lock.json, but 'npm ci' is preferred for CI
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Pass your repository secrets as environment variables to the test script
        ERPNEXT_URL: ${{ secrets.ERPNEXT_URL }}
        ERPNEXT_USER: ${{ secrets.ERPNEXT_USER }}
        ERPNEXT_PASSWORD: ${{ secrets.ERPNEXT_PASSWORD }}
        
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
